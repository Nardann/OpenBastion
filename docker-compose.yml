networks:
  frontend-net:
  backend-net:
    internal: true

services:
  postgres:
    image: postgres:17-alpine
    container_name: bastion-postgres
    restart: always
    networks:
      - backend-net
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data_v17
    volumes:
      - ./pg_data:/var/lib/postgresql
    # NOTE: no `docker-entrypoint-initdb.d` mount any more. Schema bootstrap
    # is owned entirely by Prisma migrations (backend/prisma/migrations/*),
    # so a fresh install and an upgraded install converge to the same state
    # without depending on whether init scripts ran at first Postgres boot.
    # SECURITY: drop every Linux capability except those Postgres needs for
    # its own setuid (CHOWN/SETUID/SETGID/DAC_READ_SEARCH/DAC_OVERRIDE/FOWNER
    # are needed because the entrypoint chowns PGDATA at boot).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    mem_reservation: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  guacd:
    # Image officielle Apache Guacamole, alignée sur FreeRDP 3.x.
    # Pourquoi pas notre build custom (./backend/Dockerfile.guacd) ?
    #   - Debian Bookworm ne fournit que FreeRDP 2.x (EOL upstream) qui ne
    #     sait plus negocier CredSSP face aux Windows 10/11 a jour
    #     (`Security negotiation failed`).
    #   - Debian Trixie a FreeRDP 3.15, mais guacamole-server 1.6.0 ne
    #     compile pas contre cette version (API `freerdp.input` cassee).
    #   - L'image officielle 1.6.0 (Alpine) embarque la combinaison
    #     guacd/FreeRDP testee upstream, donc on l'utilise telle quelle.
    # Le hardening (cap_drop, no-new-privileges, networks isoles) reste
    # applique par ce compose, donc on ne perd rien cote securite.
    image: guacamole/guacd:1.6.0
    container_name: bastion-guacd
    restart: always
    # backend-net : seule la backend NestJS dialogue avec guacd sur 4822.
    # frontend-net : NECESSAIRE pour l'egress. backend-net etant `internal: true`
    #   (pas de NAT vers l'exterieur), un guacd qui n'aurait que ce reseau ne
    #   pourrait JAMAIS joindre une machine Windows (`server unreachable`).
    #   Aucun `ports:` n'est declare ici, donc guacd reste invisible depuis
    #   l'hote ; on n'utilise frontend-net QUE pour sa route par defaut.
    networks:
      - backend-net
      - frontend-net
    # Run as uid 1001 (same as the backend's "nestjs" user) so RDP recording
    # files are owned by uid 1001 with guacd's hardcoded 0600 mode.
    # The nestjs process can then read them as file owner without needing
    # CAP_DAC_OVERRIDE (which is dropped in both containers for security).
    user: "1001"
    environment:
      # FreeRDP needs a writable home directory to cache TLS certificates.
      # uid 1001 has no named entry in the guacd image so its home defaults
      # to "/" (read-only). Redirect HOME to the writable /tmp tmpfs.
      HOME: /tmp
    volumes:
      - recordings_data:/var/lib/bastion/recordings
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /home/guacd:size=32m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Contraintes de ressources (guacd RDP-only consomme tres peu au repos)
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 4822 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bastion-backend
    restart: always
    networks:
      - backend-net
      - frontend-net
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      VAULT_KEY: ${VAULT_KEY}
      VAULT_SALT: ${VAULT_SALT} # OBLIGATOIRE — générer avec: openssl rand -hex 16
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-production}
      # SECURITY: HTTPS-only. Plaintext-HTTP origins are rejected at the
      # CORS layer regardless of this value, but keep the default tidy.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RECORDINGS_PATH: /var/lib/bastion/recordings
      RECORDINGS_ENABLED: ${RECORDINGS_ENABLED:-true}
      # Connexion au daemon guacd pour le proxy RDP (reseau interne uniquement)
      GUACD_HOST: ${GUACD_HOST:-guacd}
      GUACD_PORT: ${GUACD_PORT:-4822}
      # SECURITY: jeton requis en production pour /metrics (sans, /metrics est désactivé)
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # NOTE: OIDC_ALLOW_INSECURE_TLS a été retiré — utilise un cert valide
      # (mkcert pour le dev local) pour ton IdP de test.
    volumes:
      - recordings_data:/var/lib/bastion/recordings
    # ─── SECURITY HARDENING (aligned with the guacd container) ──────────
    # Read-only root FS prevents an RCE from dropping a webshell anywhere
    # except the explicit tmpfs mounts below. The entrypoint deliberately
    # avoids `prisma generate` at runtime (the client is baked into the
    # image at build time), so we only need writable space for tmp + npm
    # caches.
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /root/.npm:size=64m,noexec,nosuid
      - /root/.cache:size=32m,noexec,nosuid
      - /home/nestjs/.npm:size=64m,noexec,nosuid
      - /home/nestjs/.cache:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The entrypoint starts as root so `prisma migrate deploy` can run, then
    # `su` to nestjs (uid 1001) for the actual node process. We still need
    # SETUID/SETGID for that drop. CHOWN is for prisma's pid-file fallback.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    # Resource ceiling so a runaway request or a DoS doesn't crater the host.
    mem_limit: 1g
    mem_reservation: 256m
    pids_limit: 512
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile.frontend
    container_name: bastion-frontend
    restart: always
    networks:
      - frontend-net
    ports:
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3000}
    volumes:
      # NOTE: rw (not :ro) because the frontend entrypoint can fall back to
      # generating a self-signed cert at boot if certs/server.{crt,key} are
      # missing. Host-side permissions (700 on certs/, 600 on the key) are
      # what actually protect the material — see scripts/harden-perms.sh.
      - ./certs:/etc/nginx/ssl
    # SECURITY: nginx needs CHOWN/SETUID/SETGID to drop privileges to the
    # `nginx` worker user; everything else is dropped.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # nginx writes pid + temp dirs at runtime → tmpfs rather than read_only:false
    tmpfs:
      - /var/cache/nginx:size=32m,noexec,nosuid
      - /var/run:size=8m,noexec,nosuid
      - /tmp:size=16m,noexec,nosuid
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 128
    depends_on:
      - backend

volumes:
  recordings_data:
