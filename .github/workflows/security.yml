name: security

# Hard security gate: run on every PR + nightly so a freshly-disclosed CVE
# in a transitive dep can't sit unfixed in main for weeks.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC

permissions:
  contents: read
  security-events: write # for code-scanning upload (Semgrep)

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. npm audit — blocks PRs that introduce *high* or *critical* CVEs
  # ──────────────────────────────────────────────────────────────────────
  npm-audit:
    name: npm audit (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: backend
            workdir: 'backend'
            audit_args: '--omit=dev'
            install_args: ''
          - scope: frontend
            workdir: 'client'
            audit_args: ''
            # Frontend Dockerfile uses `--legacy-peer-deps` to side-step
            # transient peer-dep conflicts in the React 19 toolchain. CI
            # must use the same flag, otherwise `npm ci` errors out with
            # "lock file ... does not satisfy ..." on packages the legacy
            # resolver pinned to older majors (e.g. picomatch 2.x vs 4.x).
            install_args: '--legacy-peer-deps'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.workdir }}/package-lock.json
      - name: Install (lockfile-only, no scripts)
        working-directory: ${{ matrix.workdir }}
        # npm ci is strict on lockfile coherence; we fall back to a
        # non-strict `install --no-save` only as a CI safety net so a stale
        # transitive bump doesn't block the workflow entirely. The audit
        # step below is what we actually care about.
        run: |
          npm ci --ignore-scripts ${{ matrix.install_args }} \
            || npm install --no-save --ignore-scripts ${{ matrix.install_args }}
      - name: Audit (high+critical)
        working-directory: ${{ matrix.workdir }}
        run: npm audit ${{ matrix.audit_args }} --audit-level=high

  # ──────────────────────────────────────────────────────────────────────
  # 2. Semgrep — SAST. Runs OWASP rules + Node + JWT + secret scan.
  # ──────────────────────────────────────────────────────────────────────
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - run: |
          semgrep \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/nodejs \
            --config=p/jwt \
            --config=p/secrets \
            --error \
            --severity=ERROR \
            --severity=WARNING \
            --metrics=off \
            --sarif --output=semgrep.sarif \
            backend/src client/src
        continue-on-error: true
      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

  # ──────────────────────────────────────────────────────────────────────
  # 3. Secret scanning — gitleaks (defence in depth alongside GitHub's
  #    own push-protection).
  # ──────────────────────────────────────────────────────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────
  # 4. Project unit + spec tests — auth flows, vault, refresh rotation,
  #    revoke cascading. Acts as a regression gate for the security fixes.
  # ──────────────────────────────────────────────────────────────────────
  unit-tests:
    name: jest (security suites)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts || npm install --no-save --ignore-scripts
      - run: npx prisma generate
      - name: Run security-critical specs
        run: |
          npx jest \
            src/auth/refresh-token.service.spec.ts \
            src/users/revoke-tokens.spec.ts \
            src/auth/auth.service.spec.ts \
            src/auth/token-blacklist.service.spec.ts \
            src/auth/otp-lockout.service.spec.ts \
            src/common/utils/security.spec.ts \
            src/common/config/cors.config.spec.ts
